services:
  db:
    image: pgvector/pgvector:pg16
    container_name: acaep-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: acaep
      POSTGRES_PASSWORD: acaep
      POSTGRES_DB: acaep
    ports:
      - "5432:5432"
    volumes:
      - acaep_pgdata:/var/lib/postgresql/data

volumes:
  acaep_pgdata:
